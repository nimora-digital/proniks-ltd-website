[build]
command = "npm run build"
publish = "dist"
[build.environment]
NODE_VERSION = "22"
[[headers]]
for = "/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
[[redirects]]
from = "/*"
to = "/404.html"
status = 404
